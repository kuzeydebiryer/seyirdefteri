<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seyirdefteri</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1F2421" />
    <meta name="description" content="Kültür ve sanat günlüğü — film, dizi, kitap, sanat ve topluluk." />
    <!-- Genel (site geneli) paylaşım önizlemesi — WhatsApp/Facebook/Twitter gibi
         uygulamalar bir link paylaşılınca bu etiketlere bakıyor. Film/dizi/kitap/
         günce sayfaları için middleware.js bunun YERİNE o eserin kendi görseliyle
         özel bir önizleme döndürüyor (bkz. o dosyadaki not) — bu etiketler sadece
         middleware'in kapsamadığı sayfalar (Anasayfa, Profil, Topluluklar vb.)
         için yedek. -->
    <meta property="og:title" content="Seyirdefteri" />
    <meta property="og:description" content="Kültür ve sanat günlüğü — film, dizi, kitap, sanat ve topluluk." />
    <meta property="og:image" content="https://seyirdefteri.com/icons/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- iOS'ta "Ana Ekrana Ekle" ile açılan PWA'nın adres çubuğu olmadan,
         gerçek bir uygulama gibi açılması için (bkz. PWA temelleri) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seyirdefteri" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Sayfa boyanmadan önce çalışır — React yüklenene kadar bir an için
      // yanlış tema (beyaz flaş) görünmesin diye <html>'e "dark" sınıfını
      // burada, senkron olarak ekliyoruz. TemaContext.jsx ile aynı mantık.
      (function () {
        var kayitli = localStorage.getItem('tema')
        var koyuMu = kayitli === 'acik' ? false : true
        if (koyuMu) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
